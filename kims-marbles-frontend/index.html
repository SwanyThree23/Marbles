<title>Kim's Marbles</title>
<meta name="description" content="Kim's Marbles — buy, sell, trade and go live with marble collectors.">
<script>
  /* Applied before first paint (no flash): the saved choice, otherwise the system setting. */
  (function () {
    var t = null;
    try { t = localStorage.getItem('kmTheme'); } catch (e) { t = null; }
    if (t !== 'light' && t !== 'dark') {
      t = (typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
  })();
</script>
