# /etc/turnserver.conf — coturn for Kim's Marbles on turn.vibenbones.online.
# Viewers behind strict NATs or UDP-blocking networks reach the media server through this
# relay. The backend hands out short-lived credentials (GET /api/rtc/ice-servers), so
# TURN_SECRET in server/.env must equal static-auth-secret here. setup-vps.sh fills in
# __PUBLIC_IP__ and __TURN_SECRET__.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=__PUBLIC_IP__
realm=turn.vibenbones.online
server-name=turn.vibenbones.online

# "TURN REST API" credentials: username "<expiry>:<user id>", password = base64(HMAC-SHA1(secret, username))
use-auth-secret
static-auth-secret=__TURN_SECRET__

# relay ports: clear of mediasoup (44444+) — open 50000-50999/udp in the firewall
min-port=50000
max-port=50999

fingerprint
stale-nonce=600
total-quota=300
user-quota=12
no-cli
no-tlsv1
no-tlsv1_1
log-file=syslog
simple-log

# TLS for turns: (5349). The certificate is copied here by the certbot deploy hook
# (deploy/certbot-deploy-hook.sh) so coturn can read it.
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem

# SECURITY: the relay must never reach private networks or this machine's own services.
# The media server is reached at its PUBLIC address, which is not in these ranges.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
