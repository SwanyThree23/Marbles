# /etc/nginx/sites-available/kims-marbles — vibenbones.online
# One certificate covers vibenbones.online, www and turn (coturn uses it for turns:).
# setup-vps.sh installs this AFTER certbot has issued the certificate (see nginx/bootstrap.conf).

map $http_upgrade $km_connection_upgrade {
    default upgrade;
    ''      close;
}

# port 80: certificate renewals, everything else to https
server {
    listen 80;
    listen [::]:80;
    server_name vibenbones.online www.vibenbones.online turn.vibenbones.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://vibenbones.online$request_uri; }
}

# www -> the bare domain
server {
    listen 443 ssl http2;          # nginx 1.24 (Ubuntu 24.04) syntax
    listen [::]:443 ssl http2;
    server_name www.vibenbones.online;
    ssl_certificate     /etc/letsencrypt/live/vibenbones.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibenbones.online/privkey.pem;
    return 301 https://vibenbones.online$request_uri;
}

server {
    listen 443 ssl http2;          # nginx 1.24 (Ubuntu 24.04) syntax
    listen [::]:443 ssl http2;
    server_name vibenbones.online;

    ssl_certificate     /etc/letsencrypt/live/vibenbones.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibenbones.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:km_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/snippets/kims-marbles-app.conf;
}
