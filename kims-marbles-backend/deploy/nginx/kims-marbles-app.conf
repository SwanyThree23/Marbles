# /etc/nginx/snippets/kims-marbles-app.conf — the app itself: the built React site, the API
# and the real-time socket on ONE origin (so no CORS). Included by the HTTPS server block in
# kims-marbles.conf, and by the local test server that the real-browser suite runs behind.
#
# Headers are set here at server level ONLY. nginx drops inherited add_header lines in any
# location that has its own, so no location below uses add_header.

root /var/www/kims-marbles;
index index.html;
client_max_body_size 1m;
server_tokens off;

# The script hash is the inline "no flash" theme script in index.html. If that script
# changes, the frontend test src/csp.test.js fails until this hash is updated.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-mpujT+SvxzbxbG+uf7MAXNgv7BEN9Sb1LoI+bD9rd7g='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# hashed build files never change: cache for a year
location /assets/ {
    expires max;
    try_files $uri =404;
}

# the page itself always revalidates, so a deploy is picked up at once
location = /index.html {
    expires -1;
}

# client-side routes (/live/<id>, /join/<token>, ...) all load the app
location / {
    try_files $uri /index.html;
}

location /api/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # the client IP only: never trust a client-sent chain
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Content-Type-Options;          # set once, above
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
    proxy_read_timeout 60s;
}

location /socket.io/ {
    proxy_pass http://127.0.0.1:4100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $km_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;    # live rooms stay connected for hours
    proxy_send_timeout 3600s;
}

location = /health {
    proxy_pass http://127.0.0.1:4100;
    proxy_set_header X-Forwarded-For $remote_addr;
    access_log off;
}

# never public: scrape it on the server itself with the METRICS_TOKEN
location = /metrics {
    return 404;
}
