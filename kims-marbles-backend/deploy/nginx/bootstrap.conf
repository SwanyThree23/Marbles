# /etc/nginx/sites-available/kims-marbles (first boot only): plain http so certbot can prove
# the domain. setup-vps.sh replaces it with kims-marbles.conf once the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name vibenbones.online www.vibenbones.online turn.vibenbones.online;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 "Kim's Marbles is being set up.\n"; add_header Content-Type text/plain; }
}
