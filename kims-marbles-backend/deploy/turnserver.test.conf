# LOCAL TESTS ONLY (kims-marbles-frontend/e2e-browser/turn.test.mjs): a loopback relay.
# allow-loopback-peers would be a security hole on a real server; never use this file there.
listening-port=3478
listening-ip=127.0.0.1
relay-ip=127.0.0.1
external-ip=127.0.0.1
realm=turn.test
use-auth-secret
static-auth-secret=turn-test-secret
min-port=50000
max-port=50100
allow-loopback-peers
cli-password=not-used-in-tests
no-tls
no-dtls
fingerprint
verbose
