# /etc/turnserver.conf — coturn for Kim's Marbles (production template)
# Browsers behind strict NATs / UDP-blocking networks reach the SFU through this relay.
# Credentials are short-lived and issued by the backend (GET /api/rtc/ice-servers);
# TURN_SECRET in the backend's .env must equal static-auth-secret below.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
external-ip=YOUR_PUBLIC_IP          # the VPS public IPv4 (if the VPS sits behind NAT: PUBLIC/PRIVATE)
realm=turn.yourdomain.com
server-name=turn.yourdomain.com

# "TURN REST API" credentials: username "<expiry>:<user>", credential = base64(HMAC-SHA1(secret, username))
lt-cred-mech
use-auth-secret
static-auth-secret=CHANGE_ME            # openssl rand -hex 32

# relay ports — keep clear of mediasoup's 40000-49999
min-port=50000
max-port=50999

fingerprint
stale-nonce=600
total-quota=200                          # max simultaneous allocations
user-quota=12                            # per credential
no-cli
no-tlsv1
no-tlsv1_1

# TLS (for turns: / port 5349) — a Let's Encrypt cert for turn.yourdomain.com
cert=/etc/letsencrypt/live/turn.yourdomain.com/fullchain.pem
pkey=/etc/letsencrypt/live/turn.yourdomain.com/privkey.pem

# SECURITY: a relay must not be usable to reach your own network. Block private and
# special-use ranges as relay targets. (The SFU is reached via its PUBLIC address, which is
# not in these ranges. If mediasoup announces a private address, allow exactly that one with
# `allowed-peer-ip=<address>`.)
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
